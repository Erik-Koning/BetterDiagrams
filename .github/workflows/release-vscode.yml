# A tag vscode-v<version> publishes the VS Code extension. The CI that guards
# main runs on the tagged commit, the .vsix is packaged once, and that same
# file goes, as you approve each store's environment, to Open VSX (where
# Cursor, Windsurf and VSCodium install from) and to the VS Code Marketplace.
# It is attached to a GitHub Release for the tag too: for installing by hand,
# and for uploading to the Marketplace by hand if its sign-in won't take.
#
# The Marketplace signs in with Microsoft Entra ID — a managed identity,
# through OIDC — rather than a token: global Azure DevOps PATs end on
# 1 December 2026. Open VSX takes its access token, the `openvsx`
# environment's OVSX_PAT secret.
#
# Run it by hand (on main) to rehearse: the same checks and package, then each
# store's verify-pat in place of publish. A run by hand never publishes.
#
# One-time setup: packages/vscode/README.md → Publishing.
name: Release VS Code extension

on:
  push:
    tags: ["vscode-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DRY_RUN: ${{ github.event_name != 'push' }}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  package:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: The tag names the extension's version
        run: |
          version=$(node -p "require('./packages/vscode/package.json').version")
          if [ "$DRY_RUN" != true ] && [ "$GITHUB_REF_NAME" != "vscode-v$version" ]; then
            echo "::error::$GITHUB_REF_NAME doesn't name the extension's version, $version"
            exit 1
          fi
      - run: npm run package -w better-diagrams-vscode
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: packages/vscode/better-diagrams.vsix
          if-no-files-found: error

  openvsx:
    needs: package
    runs-on: ubuntu-latest
    environment: openvsx
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # ovsx as the lockfile pins it.
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: packages/vscode
      - name: Publish to Open VSX
        working-directory: packages/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            npx ovsx verify-pat mosphere
          else
            npx ovsx publish --packagePath better-diagrams.vsix
          fi

  marketplace:
    needs: package
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # vsce as the lockfile pins it.
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: packages/vscode
      # The managed identity the publisher lists as a member: its IDs, no secret.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish to the VS Code Marketplace
        working-directory: packages/vscode
        run: |
          if [ "$DRY_RUN" = true ]; then
            npx vsce verify-pat --azure-credential mosphere
          else
            npx vsce publish --azure-credential --packagePath better-diagrams.vsix
          fi

  github-release:
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - name: Attach the .vsix to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#vscode-v}"
          # This version's section of the extension's changelog.
          awk -v v="$version" '/^## /{p = index($0, "## " v) == 1; next} p' packages/vscode/CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" better-diagrams.vsix --title "VS Code extension $version" --notes-file notes.md
