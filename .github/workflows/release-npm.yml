# A version of @mosphere/better-diagrams that isn't released yet publishes
# itself: bump the version in packages/better-diagrams/package.json (and its
# CHANGELOG heading), push it to main, and this workflow runs the CI that
# guards main on that commit, publishes the package to npm by OIDC trusted
# publishing — no token anywhere — with a provenance attestation, then tags the
# commit v<version> with a GitHub Release. The tag is what marks a version
# released: a push whose version is already tagged publishes nothing. A
# prerelease version (x.y.z-…) goes out under `beta`, never `latest`. Only
# committed code can ship: the package is built from main, not from anyone's
# working tree.
#
# Run it by hand (Actions → Release npm → Run workflow, on main) to rehearse:
# the same checks and build, then `npm publish --dry-run`. A run by hand
# never publishes.
#
# One-time setup: README.md → Releasing.
name: Release npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time; a push that lands mid-release waits its turn.
concurrency:
  group: release-npm
  cancel-in-progress: false

env:
  DRY_RUN: ${{ github.event_name != 'push' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      run: ${{ steps.version.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - name: Is this version released yet?
        id: version
        run: |
          version=$(node -p "require('./packages/better-diagrams/package.json').version")
          release=false
          if [ "$DRY_RUN" != true ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            release=true
          fi
          echo "$version: release=$release dry-run=$DRY_RUN"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [ "$release" = true ] || [ "$DRY_RUN" = true ]; then run=true; else run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  checks:
    needs: version
    if: needs.version.outputs.run == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [version, checks]
    runs-on: ubuntu-latest
    # npm's trusted publisher names this file and this environment.
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      # Node 24's npm (11) is new enough for trusted publishing (11.5.1+).
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund

      # The editor the better-diagrams command serves (app/).
      - run: npm run build:app

      # prepublishOnly checks it all again first: types, tests, build, API reports, app/.
      # A version npm already has (a run whose tagging failed, run again) isn't published twice,
      # and npm refuses even a dry run over it: a rehearsal then runs the same checks and packs.
      - name: Publish
        working-directory: packages/better-diagrams
        run: |
          case "$VERSION" in *-*) tag=beta ;; *) tag=latest ;; esac
          published=false
          [ "$(npm view "@mosphere/better-diagrams@$VERSION" version 2> /dev/null)" = "$VERSION" ] && published=true
          echo "$VERSION under $tag, already on npm: $published"
          if [ "$DRY_RUN" = true ] && [ "$published" = true ]; then
            npm run prepublishOnly && npm pack --dry-run
          elif [ "$DRY_RUN" = true ]; then
            npm publish --tag "$tag" --dry-run
          elif [ "$published" = false ]; then
            npm publish --tag "$tag"
          fi

  tag:
    needs: [version, publish]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag the commit v<version>, with a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # This version's section of the changelog, if it has one.
          awk -v h="## $VERSION" '/^## /{p = ($0 == h || index($0, h " ") == 1); next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "@mosphere/better-diagrams $VERSION on npm." > notes.md
          case "$VERSION" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "@mosphere/better-diagrams $VERSION" --notes-file notes.md $pre
